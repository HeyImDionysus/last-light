name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - id: lint
        if: always()
        continue-on-error: true
        run: npm run lint
      - id: format
        if: always()
        continue-on-error: true
        run: npm run format:check
      - id: unit
        if: always()
        continue-on-error: true
        run: npm run test
      - id: browser
        if: always()
        continue-on-error: true
        run: npm run test:e2e
      - id: build
        if: always()
        continue-on-error: true
        run: npm run build
      - id: mutation
        if: always()
        continue-on-error: true
        run: npm run test:mutation
      - name: Quality gate
        if: always()
        run: |
          failed=0
          for result in \
            "${{ steps.lint.outcome }}" \
            "${{ steps.format.outcome }}" \
            "${{ steps.unit.outcome }}" \
            "${{ steps.browser.outcome }}" \
            "${{ steps.build.outcome }}" \
            "${{ steps.mutation.outcome }}"; do
            if [ "$result" != "success" ]; then failed=1; fi
          done
          exit "$failed"
