bility and lifecycle boundary', () => {\n  it('pauses immediately with visibility reason, clears input, and never auto-resumes', () => {\n    const onPause = vi.fn();\n    const onResume = vi.fn();\n    const lifecycle = createVisibilityController({ onPause, onResume });\n\n    lifecycle.changedTo('hidden');\n    lifecycle.changedTo('visible');\n\n    expect(onPause).toHaveBeenCalledWith('visibility');\n    expect(onResume).not.toHaveBeenCalled();\n  });\n\n  it('rejects Resume while hidden and accepts it only after visible user action', () => {\n    const onPause = vi.fn();\n    const onResume = vi.fn();\n    const lifecycle = createVisibilityController({ onPause, onResume });\n\n    lifecycle.changedTo('hidden');\n    expect(lifecycle.requestResume()).toBe(false);\n    lifecycle.changedTo('visible');\n    expect(lifecycle.requestResume()).toBe(true);\n    expect(onResume).toHaveBeenCalledTimes(1);\n  });\n\n  it('does not pause for blur alone and suspends audio on pagehide when supported', () => {\n    const onPause = vi.fn();\n    const suspendAudio = vi.fn();\n    const lifecycle = createVisibilityController({ onPause, onResume: vi.fn(), suspendAudio });\n\n    lifecycle.blurred();\n    expect(onPause).not.toHaveBeenCalled();\n    lifecycle.pageHidden();\n    expect(suspendAudio).toHaveBeenCalledTimes(1);\n  });\n});\n"},"tests/unit/input.contract.test.ts":{"tests":[{"id":"118","name":"shared keyboard/touch input arbitration normalizes WASD and arrows to fixed cardinal and diagonal Q16.16 vectors"},{"id":"119","name":"shared keyboard/touch input arbitration lets the most recently changed non-zero source win and falls back on release"},{"id":"120","name":"shared keyboard/touch input arbitration clears held input on pause, visibility, focus loss, and terminal transitions"},{"id":"121","name":"shared keyboard/touch input arbitration ignores key repeat and opposite-axis cancellation remains deterministic"},{"id":"122","name":"quantized thumb control keeps the 12px dead zone inclusive and emits zero inside it"},{"id":"123","name":"quantized thumb control clamps to 44 CSS pixels before exact Q16.16 normalization"},{"id":"124","name":"quantized thumb control uses truncation toward zero for negative quantized pointer coordinates"}],"source":"import { describe, expect, it } from 'vitest';\nimport { Q } from '../../src/game/constants';\nimport { createInputController } from '../../src/game/input';\nimport { quantizeThumbVector } from '../../src/platform/input';\n\nconst zero = { x: 0, y: 0 };\n\ndescribe('shared keyboard/touch input arbitration', () => {\n  it('normalizes WASD and arrows to fixed cardinal and diagonal Q16.16 vectors', () => {\n    const input = createInputController();\n\n    input.keyDown('ArrowRight');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n    input.keyDown('ArrowDown');\n    expect(input.movementForTick()).toEqual({ x: 46_341, y: 46_341 });\n    input.keyUp('ArrowRight');\n    expect(input.movementForTick()).toEqual({ x: 0, y: Q });\n    input.keyUp('ArrowDown');\n    expect(input.movementForTick()).toEqual(zero);\n  });\n\n  it('lets the most recently changed non-zero source win and falls back on release', () => {\n    const input = createInputController();\n\n    input.keyDown('KeyA');\n    input.setTouch({ x: Q, y: 0 });\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n    input.releaseTouch();\n    expect(input.movementForTick()).toEqual({ x: -Q, y: 0 });\n    input.clear();\n    expect(input.movementForTick()).toEqual(zero);\n  });\n\n  it('clears held input on pause, visibility, focus loss, and terminal transitions', () => {\n    const input = createInputController();\n    input.keyDown('KeyW');\n    input.setTouch({ x: Q, y: 0 });\n\n    for (const interruption of ['pause', 'visibility', 'blur', 'terminal'] as const) {\n      input.interrupt(interruption);\n      expect(input.movementForTick()).toEqual(zero);\n      input.keyDown('KeyW');\n    }\n  });\n\n  it('ignores key repeat and opposite-axis cancellation remains deterministic', () => {\n    const input = createInputController();\n    input.keyDown('KeyD');\n    input.keyDown('KeyD');\n    input.keyDown('KeyA');\n    expect(input.movementForTick()).toEqual(zero);\n    input.keyUp('KeyA');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n  });\n});\n\ndescribe('quantized thumb control', () => {\n  it('keeps the 12px dead zone inclusive and emits zero inside it', () => {\n    expect(quantizeThumbVector(12 * 256, 0)).toEqual(zero);\n    expect(quantizeThumbVector(12 * 256 + 1, 0)).not.toEqual(zero);\n  });\n\n  it('clamps to 44 CSS pixels before exact Q16.16 normalization', () => {\n    const vector = quantizeThumbVector(100 * 256, 0);\n\n    expect(vector.x).toBe(Q);\n    expect(vector.y).toBe(0);\n  });\n\n  it('uses truncation toward zero for negative quantized pointer coordinates', () => {\n    expect(quantizeThumbVector(-12 * 256 - 1, 0).x).toBeLessThan(0);\n    expect(quantizeThumbVector(0, -12 * 256 - 1).y).toBeLessThan(0);\n  });\n});\n"}},"projectRoot":"/root/projects/last-light/.worktrees/t_3b4669a8","config":{"testRunner":"vitest","reporters":["clear-text","progress","html"],"coverageAnalysis":"perTest","mutate":["src/game/**/*.ts","src/platform/**/*.ts"],"testFiles":["tests/unit/**/*.test.ts"],"thresholds":{"high":90,"low":80,"break":80},"vitest":{"configFile":"vitest.config.ts","related":true},"allowConsoleColors":true,"checkers":[],"checkerNodeArgs":[],"commandRunner":{"command":"npm test"},"clearTextReporter":{"allowColor":true,"allowEmojis":false,"logTests":true,"maxTestsToLog":3,"reportTests":true,"reportMutants":true,"reportScoreTable":true,"skipFull":false},"dashboard":{"baseUrl":"https://dashboard.stryker-mutator.io/api/reports","reportType":"full"},"dryRunOnly":false,"eventReporter":{"baseDir":"reports/mutation/events"},"ignorePatterns":[],"ignoreStatic":false,"incremental":false,"incrementalFile":"reports/stryker-incremental.json","force":fa
