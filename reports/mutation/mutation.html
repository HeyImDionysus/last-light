":"seeded world construction preserves spawn safety invariants across a fixed-seed property sample"},{"id":"5","name":"fixed-step reducer contract rejects invalid movement vectors and duplicate entity IDs at the domain boundary"},{"id":"6","name":"fixed-step reducer contract rejects a zero stored gameplay RNG state at the domain boundary"},{"id":"7","name":"fixed-step reducer contract increments only active ticks and drains exact integer lantern units outside safety"},{"id":"8","name":"fixed-step reducer contract uses the exact signed Q16.16 per-tick shadow displacement"},{"id":"9","name":"fixed-step reducer contract creates no shadow before tick 720 and creates at most the eligible target on cadence"},{"id":"10","name":"fixed-step reducer contract defers exactly 32 rejected respawn candidates by 60 active ticks without allocating an ID"},{"id":"11","name":"fixed-step reducer contract applies a lit-lantern repel once after pursuit and resets grace"},{"id":"12","name":"fixed-step reducer contract loses on an eligible empty-lantern collision but not during grace"},{"id":"13","name":"fixed-step reducer contract deposits, refills, scores from pre-refill energy, and wins on an overshooting goal"},{"id":"14","name":"fixed-step reducer contract recharges passively but does not instantly refill on an empty visit"},{"id":"15","name":"score formulas includes deposit amount, quadratic delivery bonus, and floored pre-refill energy"},{"id":"16","name":"score formulas clamps the win speed bonus at zero after seven minutes"}],"source":"import { describe, expect, it } from 'vitest';\nimport { createRound } from '../../src/game/world';\nimport { advance } from '../../src/game/reducer';\nimport { attemptStarRespawn } from '../../src/game/spawn';\nimport { Q } from '../../src/game/constants';\nimport { scoreDeposit, scoreWinBonus } from '../../src/game/scoring';\n\nconst STILL = { x: 0, y: 0 } as const;\nconst EAST = { x: Q, y: 0 } as const;\n\nfunction tick(state: unknown, movementQ: { x: number; y: number } = STILL) {\n  return advance(state as never, { kind: 'tick', movementQ });\n}\n\nfunction replace<"+"T extends Record<"+"string, unknown>>(state: T, patch: Partial<"+"T>): T {\n  return { ...state, ...patch };\n}\n\ndescribe('seeded world construction', () => {\n  it('starts every valid round with exact obstacle/star quotas and stable IDs', () => {\n    const round = createRound(0x1234_5678) as any;\n\n    expect(round.tick).toBe(0);\n    expect(round.obstacles).toHaveLength(24);\n    expect(round.obstacles.map((item: any) => item.id)).toEqual([...Array(24).keys()]);\n    expect(round.availableStars).toHaveLength(28);\n    expect(round.availableStars.map((item: any) => item.id)).toEqual([...Array(28).keys()]);\n    expect(round.shadows).toEqual([]);\n    expect(round.bankedStars).toBe(0);\n    expect(round.carriedStars).toEqual([]);\n    expect(round.lantern.energyUnits).toBe(60_000);\n  });\n\n  it('replays identical world geometry and PRNG state for the same seed', () => {\n    const first = createRound(0xcafe_babe) as any;\n    const second = createRound(0xcafe_babe) as any;\n\n    expect(second).toEqual(first);\n    expect(second.rngState).toBe(first.rngState);\n  });\n\n  it('keeps initial stars in their fixed distance bands and separated from one another', () => {\n    const round = createRound(0xdec0_de01) as any;\n    const lighthouse = { x: 1_200 * Q, y: 800 * Q };\n\n    for (const [index, star] of round.availableStars.entries()) {\n      const distance = Math.hypot(star.centerQ.x - lighthouse.x, star.centerQ.y - lighthouse.y) / Q;\n      expect(distance).toBeGreaterThan(150);\n      if (index <"+" 10) expect(distance).toBeLessThanOrEqual(850);\n      if (index >= 10 && index <"+" 20) expect(distance).toBeGreaterThan(850);\n      if (index <"+" 20) expect(distance).toBeLessThanOrEqual(index <"+" 10 ? 850 : 1_500);\n      for (const other of round.availableStars.slice(0, index)) {\n        expect(\n          Math.hypot(star.centerQ.x - other.centerQ.x, star.centerQ.y - other.centerQ.y) / Q,\n        ).toBeGreaterThan(100);\n      }\n    }\n  });\n\n  it('fails the round construction boundary instead of returning partial geometry', () => {\n    expect(() => createRound(0)).not.toThrow();\n    expect(() => createRound(0x0000_0001)).not.toThrow();\n  });\n\n  it('preserves spawn safety invariants across a fixed-seed property sample', () => {\n    const lighthouse = { x: 1_200 * Q, y: 800 * Q };\n    for (let seed = 0; seed <"+" 1_000; seed += 1) {\n      const round = createRound(seed) as any;\n      expect(round.obstacles).toHaveLength(24);\n      expect(round.availableStars).toHaveLength(28);\n      for (const obstacle of round.obstacles) {\n        expect(obstacle.x).toBeGreaterThanOrEqual(80);\n        expect(obstacle.y).toBeGreaterThanOrEqual(80);\n        expect(obstacle.x + obstacle.width).toBeLessThanOrEqual(2_320);\n        expect(obstacle.y + obstacle.height).toBeLessThanOrEqual(1_520);\n      }\n      for (const star of round.availableStars) {\n        const distance =\n          Math.hypot(star.centerQ.x - lighthouse.x, star.centerQ.y - lighthouse.y) / Q;\n        expect(distance).toBeGreaterThan(150);\n        for (const obstacle of round.obstacles) {\n          const closestX = Math.max(\n            obstacle.x,\n            Math.min(star.centerQ.x / Q, obstacle.x + obstacle.width),\n          );\n          const closestY = Math.max(\n            obstacle.y,\n            Math.min(star.centerQ.y / Q, obstacle.y + obstacle.height),\n          );\n          expect(\n            Math.hypot(star.centerQ.x / Q - closestX, star.centerQ.y / Q - closestY),\n          ).toBeGreaterThan(34);\n        }\n      }\n    }\n  }, 30_000);\n});\n\ndescribe('fixed-step reducer contract', () => {\n  it('rejects invalid movement vectors and duplicate entity IDs at the domain boundary', () => {\n    const round = createRound(0x1234_5678) as any;\n\n    expect(() => advance(round, { kind: 'tick', movementQ: { x: Q, y: Q } } as never)).toThrow();\n    expect(() =>\n      advance(\n        { ...round, availableStars: [round.availableStars[0], round.availableStars[0]] },\n        { kind: 'tick', movementQ: STILL },\n      ),\n    ).toThrow();\n  });\n\n  it('rejects a zero stored gameplay RNG state at the domain boundary', () => {\n    const round = createRound(0x1234_5678) as any;\n    expect(round.rngState).not.toBe(0);\n\n    expect(() => tick(replace(round, { rngState: 0 }))).toThrow();\n  });\n\n  it('increments only active ticks and drains exact integer lantern units outside safety', () => {\n    const round = createRound(0x1234_5678) as any;\n    const initial = replace(round, {\n      player: { ...round.player, centerQ: { x: 1_600 * Q, y: 800 * Q } },\n    });\n    expect(\n      Math.hypot(initial.player.centerQ.x - 1_200 * Q, initial.player.centerQ.y - 800 * Q) / Q,\n    ).toBeGreaterThan(150);\n    const one = tick(initial, EAST).state as any;\n    const sixty = Array.from({ length: 59 }).reduce((state) => tick(state, EAST).state, one) as any;\n\n    expect(one.tick).toBe(1);\n    expect(one.lantern.energyUnits).toBe(59_952);\n    expect(sixty.tick).toBe(60);\n    expect(sixty.lantern.energyUnits).toBe(57_120);\n  });\n\n  it('uses the exact signed Q16.16 per-tick shadow displacement', () => {\n    const initial = createRound(0x1234_5678) as any;\n    const state = replace(initial, {\n      shadows: [{ id: 0, centerQ: { x: 1_800 * Q, y: 800 * Q }, graceTicks: 0 }],\n      lantern: { ...initial.lantern, energyUnits: 0 },\n    });\n\n    const next = tick(state).state as any;\n    expect(next.shadows[0].centerQ.x).toBe(1_800 * Q - 100_488);\n    expect(next.shadows[0].centerQ.y).toBe(800 * Q);\n  });\n\n  it('creates no shadow before tick 720 and creates at most the eligible target on cadence', () => {\n    let state: any = createRound(0x9abc_def0);\n    for (let index = 0; index <"+" 719; index += 1) state = tick(state).state;\n    expect(state.tick).toBe(719);\n    expect(state.shadows).toHaveLength(0);\n\n    state = tick(state).state;\n    expect(state.tick).toBe(720);\n    expect(state.shadows.length).toBeLessThanOrEqual(2);\n    expect(state.shadows[0]?.graceTicks).toBe(21);\n    for (const shadow of state.shadows) {\n      const player = state.player.centerQ;\n      const lighthouse = { x: 1_200 * Q, y: 800 * Q };\n      expect(\n        Math.hypot(shadow.centerQ.x - player.x, shadow.centerQ.y - player.y) / Q,\n      ).toBeGreaterThanOrEqual(520);\n      expect(\n        Math.hypot(shadow.centerQ.x - player.x, shadow.centerQ.y - player.y) / Q,\n      ).toBeLessThanOrEqual(760);\n      expect(\n        Math.hypot(shadow.centerQ.x - lighthouse.x, shadow.centerQ.y - lighthouse.y) / Q,\n      ).toBeGreaterThanOrEqual(300);\n    }\n  });\n\n  it('defers exactly 32 rejected respawn candidates by 60 active ticks without allocating an ID', () => {\n    const initial = createRound(0xfeed_beef) as any;\n    const state = replace(initial, {\n      tick: 719,\n      availableStars: [],\n      carriedStars: [],\n      pendingStarRespawn: { dueTick: 720 },\n      nextStarId: 28,\n    });\n    const invalidCandidates = Array.from({ length: 32 }, (_, index) => ({\n      centerQ: { x: 1_200 * Q, y: 800 * Q },\n      rngState: index + 1,\n    }));\n    let candidateIndex = 0;\n    const next = attemptStarRespawn(state, {\n      currentTick: 720,\n      nextCandidate: () => {\n        const candidate = invalidCandidates[candidateIndex];\n        if (!candidate) throw new Error('candidate source exhausted');\n        candidateIndex += 1;\n        return candidate;\n      },\n    }) as any;\n\n    expect(state.rngState).not.toBe(0);\n    expect(candidateIndex).toBe(32);\n    expect(next.pendingStarRespawn.dueTick).toBe(780);\n    expect(next.availableStars).toHaveLength(0);\n    expect(next.carriedStars).toHaveLength(0);\n    expect(next.nextStarId).toBe(28);\n    expect(next.rngState).toBe(32);\n  });\n\n  it('applies a lit-lantern repel once after pursuit and resets grace', () => {\n    const initial = createRound(0x1234_5678) as any;\n    const playerCenterQ = { x: 1_800 * Q, y: 800 * Q };\n    const shadowCenterQ = { x: playerCenterQ.x + 155 * Q, y: playerCenterQ.y };\n    const state = replace(initial, {\n      player: { ...initial.player, centerQ: playerCenterQ },\n      shadows: [{ id: 0, centerQ: shadowCenterQ, graceTicks: 0 }],\n    });\n    expect(\n      Math.hypot(shadowCenterQ.x - 1_200 * Q, shadowCenterQ.y - 800 * Q) / Q,\n    ).toBeGreaterThanOrEqual(169);\n\n    const next = tick(state).state as any;\n    expect(next.shadows[0].graceTicks).toBe(21);\n    expect(next.shadows[0].centerQ.x).toBeGreaterThan(shadowCenterQ.x);\n  });\n\n  it('loses on an eligible empty-lantern collision but not during grace', () => {\n    const initial = createRound(0x1234_5678) as any;\n    const playerCenterQ = { x: 1_800 * Q, y: 800 * Q };\n    const colliding = {\n      id: 0,\n      centerQ: { x: playerCenterQ.x + 37 * Q, y: playerCenterQ.y },\n      graceTicks: 0,\n    };\n    const state = replace(initial, {\n      player: { ...initial.player, centerQ: playerCenterQ },\n      lantern: { ...initial.lantern, energyUnits: 0 },\n      shadows: [colliding],\n    });\n    expect(\n      Math.hypot(colliding.centerQ.x - 1_200 * Q, colliding.centerQ.y - 800 * Q) / Q,\n    ).toBeGreaterThanOrEqual(169);\n\n    expect((tick(state).state as any).phase).toBe('lost');\n    expect(\n      (tick(replace(state, { shadows: [{ ...colliding, graceTicks: 1 }] })).state as any).phase,\n    ).toBe('playing');\n  });\n\n  it('deposits, refills, scores from pre-refill energy, and wins on an overshooting goal', () => {\n    const initial = createRound(0x1234_5678) as any;\n    const state = replace(initial, {\n      player: { ...initial.player, centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      carriedStars: [1, 2, 3, 4, 5],\n      bankedStars: 18,\n      score: 0,\n      lantern: { ...initial.lantern, energyUnits: 30_599 },\n    });\n\n    const next = tick(state).state as any;\n    expect(next.bankedStars).toBe(23);\n    expect(next.lantern.energyUnits).toBe(60_000);\n    // Step 2 recharges to 30_999 before step 6 snapshots pre-refill energy.\n    expect(next.score).toBe(100 * 5 + 25 * 25 + 10 * 51 + 4_200);\n    expect(next.phase).toBe('won');\n  });\n\n  it('recharges passively but does not instantly refill on an empty visit', () => {\n    const initial = createRound(0x1234_5678) as any;\n    const state = replace(initial, {\n      player: { ...initial.player, centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      carriedStars: [],\n      lantern: { ...initial.lantern, energyUnits: 0 },\n    });\n\n    expect((tick(state).state as any).lantern.energyUnits).toBe(400);\n  });\n});\n\ndescribe('score formulas', () => {\n  it('includes deposit amount, quadratic delivery bonus, and floored pre-refill energy', () => {\n    expect(scoreDeposit({ depositedStars: 1, preRefillEnergyUnits: 59_999 })).toBe(1_115);\n    expect(scoreDeposit({ depositedStars: 5, preRefillEnergyUnits: 30_599 })).toBe(1_625);\n  });\n\n  it('clamps the win speed bonus at zero after seven minutes', () => {\n    expect(scoreWinBonus(0)).toBe(4_200);\n    expect(scoreWinBonus(7 * 60 * 60)).toBe(0);\n    expect(scoreWinBonus(8 * 60 * 60)).toBe(0);\n  });\n});\n"},"tests/unit/mutation-gap.test.ts":{"tests":[{"id":"17","name":"mutation-gap input contracts recognizes every supported code: ArrowUp"},{"id":"18","name":"mutation-gap input contracts recognizes every supported code: KeyW"},{"id":"19","name":"mutation-gap input contracts recognizes every supported code: ArrowDown"},{"id":"20","name":"mutation-gap input contracts recognizes every supported code: KeyS"},{"id":"21","name":"mutation-gap input contracts recognizes every supported code: ArrowLeft"},{"id":"22","name":"mutation-gap input contracts recognizes every supported code: KeyA"},{"id":"23","name":"mutation-gap input contracts recognizes every supported code: ArrowRight"},{"id":"24","name":"mutation-gap input contracts recognizes every supported code: KeyD"},{"id":"25","name":"mutation-gap input contracts handles both aliases and all opposite-axis combinations"},{"id":"26","name":"mutation-gap input contracts uses the latest nonzero source after each real source change"},{"id":"27","name":"mutation-gap RNG contracts rejects every invalid inclusive range boundary"},{"id":"28","name":"mutation-gap RNG contracts keeps deterministic inclusive mapping for several spans"},{"id":"29","name":"mutation-gap thumb quantization contracts normalizes every cardinal and diagonal direction, including negatives"},{"id":"30","name":"mutation-gap thumb quantization contracts clamps both coordinates to the maximum radius before normalization"},{"id":"31","name":"mutation-gap world geometry contracts preserves every obstacle row exactly"},{"id":"32","name":"mutation-gap world geometry contracts uses the three documented star rings with stable local IDs and coordinates"},{"id":"33","name":"mutation-gap storage contracts rejects invalid version while retaining defaults"},{"id":"34","name":"mutation-gap storage contracts rejects invalid bestScore type while retaining defaults"},{"id":"35","name":"mutation-gap storage contracts rejects invalid bestScore negative while retaining defaults"},{"id":"36","name":"mutation-gap storage contracts rejects invalid bestScore too large while retaining defaults"},{"id":"37","name":"mutation-gap storage contracts rejects invalid muted type while retaining defaults"},{"id":"38","name":"mutation-gap storage contracts rejects invalid highContrast type while retaining defaults"},{"id":"39","name":"mutation-gap storage contracts rejects invalid reducedMotion type while retaining defaults"},{"id":"40","name":"mutation-gap storage contracts accepts both inclusive best-score limits and all known fields"},{"id":"41","name":"mutation-gap storage contracts treats exactly 1024 bytes as valid and 1025 bytes as invalid"},{"id":"42","name":"mutation-gap storage contracts rejects non-plain objects on save without touching storage"},{"id":"43","name":"mutation-gap reducer contracts rejects each malformed movement/state scalar and duplicate entity list"},{"id":"44","name":"mutation-gap reducer contracts clamps player motion independently at all four world borders"},{"id":"45","name":"mutation-gap reducer contracts moves shadows diagonally and increases pursuit speed after each five banked stars"},{"id":"46","name":"mutation-gap reducer contracts keeps shadows outside the lighthouse radial boundary"},{"id":"47","name":"mutation-gap reducer contracts applies repel at the inclusive radius and records both axes"},{"id":"48","name":"mutation-gap reducer contracts collides at the inclusive radius only when the lantern is empty"},{"id":"49","name":"mutation-gap reducer contracts decrements ordinary shadow grace and never decrements newly spawned grace"},{"id":"50","name":"mutation-gap reducer contracts spawns on the exact 720-tick cadence and respects the banked-star cap"},{"id":"51","name":"mutation-gap reducer contracts creates and consumes a pending respawn only when the total star count is below 28"},{"id":"52","name":"mutation-gap reducer contracts picks up only within the inclusive radius and never exceeds five carried stars"},{"id":"53","name":"mutation-gap reducer contracts deposits at the inclusive radius and wins at exactly twenty banked stars"},{"id":"54","name":"mutation-gap respawn geometry contracts rejects each forbidden star neighborhood before accepting a safe candidate"},{"id":"55","name":"mutation-gap respawn geometry contracts defers a missing candidate source safely and retries after the documented delay"},{"id":"56","name":"mutation-gap respawn geometry contracts enforces every inclusive respawn boundary and expanded obstacle boundary"},{"id":"57","name":"mutation-gap reducer boundary contracts distinguishes fresh shadows from existing shadows during a spawn tick"},{"id":"58","name":"mutation-gap reducer boundary contracts uses banked-star shadow capacity and preserves the spawn position and ID"},{"id":"59","name":"mutation-gap reducer boundary contracts does not create a respawn before cadence or when total stars are already at capacity"},{"id":"60","name":"mutation-gap reducer boundary contracts distinguishes safe-zone and collision boundaries and reports gameplay events"},{"id":"61","name":"mutation-gap reducer boundary contracts uses diagonal radial correction output rather than only its x coordinate"},{"id":"62","name":"mutation-gap reducer terminal and cadence contracts returns terminal states unchanged without events"},{"id":"63","name":"mutation-gap reducer terminal and cadence contracts distinguishes the exact shadow capacity at five banked stars"},{"id":"64","name":"mutation-gap respawn upper obstacle boundaries distinguishes every upper clearance edge of an obstacle"}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { Q, MAX_ENERGY_UNITS } from '../../src/game/constants';\nimport { createInputController } from '../../src/game/input';\nimport { advance } from '../../src/game/reducer';\nimport { createRng } from '../../src/game/rng';\nimport { attemptStarRespawn } from '../../src/game/spawn';\nimport { createRound } from '../../src/game/world';\nimport { quantizeThumbVector } from '../../src/platform/input';\nimport { loadPreferences, savePreferences } from '../../src/platform/storage';\n\ntype AnyState = any;\nconst STILL = { x: 0, y: 0 } as const;\nconst EAST = { x: Q, y: 0 } as const;\nconst WEST = { x: -Q, y: 0 } as const;\nconst NORTH = { x: 0, y: -Q } as const;\nconst SOUTH = { x: 0, y: Q } as const;\n\nfunction tick(state: AnyState, movementQ: { x: number; y: number } = STILL) {\n  return advance(state, { kind: 'tick', movementQ });\n}\n\nfunction patch(state: AnyState, changes: AnyState): AnyState {\n  return { ...state, ...changes };\n}\n\nfunction storage(overrides: Partial<"+"Storage> = {}): Storage {\n  return {\n    getItem: vi.fn(() => null),\n    setItem: vi.fn(),\n    removeItem: vi.fn(),\n    clear: vi.fn(),\n    key: vi.fn(() => null),\n    get length() {\n      return 0;\n    },\n    ...overrides,\n  } as Storage;\n}\n\ndescribe('mutation-gap input contracts', () => {\n  it.each([\n    ['ArrowUp', { x: 0, y: -Q }],\n    ['KeyW', { x: 0, y: -Q }],\n    ['ArrowDown', { x: 0, y: Q }],\n    ['KeyS', { x: 0, y: Q }],\n    ['ArrowLeft', { x: -Q, y: 0 }],\n    ['KeyA', { x: -Q, y: 0 }],\n    ['ArrowRight', { x: Q, y: 0 }],\n    ['KeyD', { x: Q, y: 0 }],\n  ])('recognizes every supported code: %s', (code, expected) => {\n    const input = createInputController();\n    input.keyDown(code);\n    expect(input.movementForTick()).toEqual(expected);\n    input.keyDown(code);\n    input.keyDown('Escape');\n    expect(input.movementForTick()).toEqual(expected);\n    input.keyUp('Escape');\n    input.keyUp(code);\n    expect(input.movementForTick()).toEqual({ x: 0, y: 0 });\n  });\n\n  it('handles both aliases and all opposite-axis combinations', () => {\n    const input = createInputController();\n    input.keyDown('ArrowUp');\n    input.keyDown('KeyS');\n    expect(input.movementForTick()).toEqual({ x: 0, y: 0 });\n    input.keyDown('ArrowRight');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n    input.keyDown('KeyA');\n    expect(input.movementForTick()).toEqual({ x: 0, y: 0 });\n    input.keyUp('ArrowUp');\n    expect(input.movementForTick()).toEqual({ x: 0, y: Q });\n    input.keyUp('KeyS');\n    input.keyUp('ArrowRight');\n    input.keyUp('KeyA');\n    expect(input.movementForTick()).toEqual({ x: 0, y: 0 });\n  });\n\n  it('uses the latest nonzero source after each real source change', () => {\n    const input = createInputController();\n    input.keyDown('KeyD');\n    input.setTouch({ x: -Q, y: 0 });\n    expect(input.movementForTick()).toEqual({ x: -Q, y: 0 });\n    input.keyDown('KeyW');\n    expect(input.movementForTick()).toEqual({ x: 46_341, y: -46_341 });\n    input.keyUp('KeyW');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n    input.releaseTouch();\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n  });\n});\n\ndescribe('mutation-gap RNG contracts', () => {\n  it('rejects every invalid inclusive range boundary', () => {\n    const rng = createRng(1);\n    const invalidRanges: Array<"+"[number, number]> = [\n      [1.5, 2],\n      [1, 2.5],\n      [Number.NaN, 2],\n      [1, Number.POSITIVE_INFINITY],\n      [2, 1],\n    ];\n    for (const [min, max] of invalidRanges)\n      expect(() => rng.int(min, max)).toThrow('invalid rng range');\n    expect(rng.int(7, 7)).toBe(7);\n  });\n\n  it('keeps deterministic inclusive mapping for several spans', () => {\n    const two = createRng(0xfeed_beef);\n    expect(Array.from({ length: 5 }, () => two.int(0, 1))).toEqual([1, 1, 0, 0, 0]);\n    const three = createRng(0xfeed_beef);\n    expect(Array.from({ length: 5 }, () => three.int(-1, 1))).toEqual([1, -1, 1, 0, 0]);\n    const nine = createRng(0xfeed_beef);\n    expect(Array.from({ length: 5 }, () => nine.int(0, 8))).toEqual([2, 3, 2, 7, 1]);\n  });\n});\n\ndescribe('mutation-gap thumb quantization contracts', () => {\n  it('normalizes every cardinal and diagonal direction, including negatives', () => {\n    expect(quantizeThumbVector(13 * 256, 0)).toEqual({ x: Q, y: 0 });\n    expect(quantizeThumbVector(0, -13 * 256)).toEqual({ x: 0, y: -Q });\n    expect(quantizeThumbVector(20 * 256, 21 * 256)).toEqual({ x: 45_197, y: 47_457 });\n    expect(quantizeThumbVector(-20 * 256, 21 * 256)).toEqual({ x: -45_197, y: 47_457 });\n    expect(quantizeThumbVector(-100 * 256, -50 * 256)).toEqual({ x: -58_623, y: -29_308 });\n  });\n\n  it('clamps both coordinates to the maximum radius before normalization', () => {\n    expect(quantizeThumbVector(100 * 256, 50 * 256)).toEqual({ x: 58_623, y: 29_308 });\n    expect(quantizeThumbVector(-50 * 256, 100 * 256)).toEqual({ x: -29_308, y: 58_623 });\n  });\n});\n\ndescribe('mutation-gap world geometry contracts', () => {\n  it('preserves every obstacle row exactly', () => {\n    const round = createRound(1) as AnyState;\n    expect(round.obstacles.map((o: AnyState) => [o.x, o.y, o.width, o.height])).toEqual([\n      [100, 100, 160, 128],\n      [420, 100, 176, 112],\n      [760, 100, 144, 160],\n      [1080, 100, 160, 128],\n      [1400, 100, 176, 112],\n      [1740, 100, 144, 160],\n      [2060, 100, 160, 128],\n      [100, 420, 160, 128],\n      [2140, 420, 160, 128],\n      [100, 740, 160, 128],\n      [2140, 740, 160, 128],\n      [100, 1060, 160, 128],\n      [2140, 1060, 160, 128],\n      [100, 1380, 160, 128],\n      [420, 1380, 176, 112],\n      [760, 1380, 144, 140],\n      [1080, 1380, 160, 128],\n      [1400, 1380, 176, 112],\n      [1740, 1380, 144, 140],\n      [2060, 1380, 160, 128],\n      [400, 620, 112, 112],\n      [1888, 620, 112, 112],\n      [400, 940, 112, 112],\n      [1888, 940, 112, 112],\n    ]);\n  });\n\n  it('uses the three documented star rings with stable local IDs and coordinates', () => {\n    const round = createRound(1) as AnyState;\n    for (const [id, x, y] of [\n      [0, 111411200, 52428800],\n      [9, 105153069, 33168253],\n      [10, 137625600, 52428800],\n      [19, 126360964, 17759815],\n      [20, 91750400, 52428800],\n      [27, 87911390, 43160610],\n    ] as Array<"+"[number, number, number]>)\n      expect(round.availableStars[id]).toMatchObject({ id, centerQ: { x, y } });\n  });\n});\n\ndescribe('mutation-gap storage contracts', () => {\n  const defaults = {\n    version: 1,\n    bestScore: 0,\n    muted: false,\n    highContrast: false,\n    reducedMotion: 'system' as const,\n  };\n\n  it.each([\n    ['version', { version: 2 }],\n    ['bestScore type', { bestScore: 1.2 }],\n    ['bestScore negative', { bestScore: -1 }],\n    ['bestScore too large', { bestScore: 1_000_001 }],\n    ['muted type', { muted: 'yes' }],\n    ['highContrast type', { highContrast: 1 }],\n    ['reducedMotion type', { reducedMotion: 'sometimes' }],\n  ])('rejects invalid %s while retaining defaults', (_name, change) => {\n    const target = storage({ getItem: vi.fn(() => JSON.stringify({ ...defaults, ...change })) });\n    expect(loadPreferences(target)).toEqual({ ok: false, value: defaults, reason: 'invalid' });\n  });\n\n  it('accepts both inclusive best-score limits and all known fields', () => {\n    for (const bestScore of [0, 1_000_000]) {\n      const value = {\n        ...defaults,\n        bestScore,\n        muted: true,\n        highContrast: true,\n        reducedMotion: 'off' as const,\n      };\n      expect(loadPreferences(storage({ getItem: vi.fn(() => JSON.stringify(value)) }))).toEqual({\n        ok: true,\n        value,\n      });\n      const target = storage();\n      expect(savePreferences(target, value)).toBe(true);\n      expect(target.setItem).toHaveBeenCalledWith(\n        'last-light:preferences:v1',\n        JSON.stringify(value),\n      );\n    }\n  });\n\n  it('treats exactly 1024 bytes as valid and 1025 bytes as invalid', () => {\n    const sized = (length: number) => {\n      let padding = '';\n      while (JSON.stringify({ ...defaults, padding }).length <"+" length) padding += 'x';\n      while (JSON.stringify({ ...defaults, padding }).length > length)\n        padding = padding.slice(0, -1);\n      return JSON.stringify({ ...defaults, padding });\n    };\n    const atLimit = loadPreferences(storage({ getItem: vi.fn(() => sized(1024)) }));\n    expect(atLimit.ok).toBe(true);\n    expect(loadPreferences(storage({ getItem: vi.fn(() => sized(1025)) }))).toMatchObject({\n      ok: false,\n      reason: 'invalid',\n    });\n  });\n\n  it('rejects non-plain objects on save without touching storage', () => {\n    const target = storage();\n    expect(savePreferences(target, Object.assign(Object.create(null), { version: 1 }))).toBe(false);\n    expect(savePreferences(target, [] as never)).toBe(false);\n    expect(target.setItem).not.toHaveBeenCalled();\n  });\n});\n\ndescribe('mutation-gap reducer contracts', () => {\n  it('rejects each malformed movement/state scalar and duplicate entity list', () => {\n    const round = createRound(1) as AnyState;\n    expect(() => tick(round, { x: Number.NaN, y: 0 })).toThrow('invalid movement');\n    expect(() => tick(round, { x: 0, y: Number.POSITIVE_INFINITY })).toThrow('invalid movement');\n    expect(() => tick(round, { x: Q + 1, y: Q })).toThrow('invalid movement');\n    expect(() => tick(patch(round, { rngState: 1.5 }))).toThrow('invalid game state');\n    expect(() => tick(patch(round, { lantern: { energyUnits: -1 } }))).toThrow('invalid lantern');\n    expect(() => tick(patch(round, { lantern: { energyUnits: MAX_ENERGY_UNITS + 1 } }))).toThrow(\n      'invalid lantern',\n    );\n    for (const field of ['obstacles', 'availableStars', 'shadows'] as const) {\n      const item = round[field][0] ?? {\n        id: 0,\n        centerQ: { x: 2_000 * Q, y: 1_200 * Q },\n        graceTicks: 0,\n      };\n      expect(() => tick(patch(round, { [field]: [item, { ...item }] }))).toThrow(\n        'duplicate entity id',\n      );\n    }\n  });\n\n  it('clamps player motion independently at all four world borders', () => {\n    const round = createRound(1) as AnyState;\n    expect(\n      tick(patch(round, { player: { centerQ: { x: 2_381 * Q, y: 800 * Q } } }), EAST).state.player\n        .centerQ.x,\n    ).toBe(2_382 * Q);\n    expect(\n      tick(patch(round, { player: { centerQ: { x: 19 * Q, y: 800 * Q } } }), WEST).state.player\n        .centerQ.x,\n    ).toBe(18 * Q);\n    expect(\n      tick(patch(round, { player: { centerQ: { x: 1_200 * Q, y: 1_581 * Q } } }), SOUTH).state\n        .player.centerQ.y,\n    ).toBe(1_582 * Q);\n    expect(\n      tick(patch(round, { player: { centerQ: { x: 1_200 * Q, y: 19 * Q } } }), NORTH).state.player\n        .centerQ.y,\n    ).toBe(18 * Q);\n  });\n\n  it('moves shadows diagonally and increases pursuit speed after each five banked stars', () => {\n    const round = createRound(1) as AnyState;\n    const diagonal = patch(round, {\n      player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      shadows: [{ id: 0, centerQ: { x: 1_500 * Q, y: 1_100 * Q }, graceTicks: 0 }],\n    });\n    const diagonalNext = tick(diagonal).state as AnyState;\n    expect(diagonalNext.shadows[0].centerQ).toEqual({\n      x: 1_500 * Q - 71_054,\n      y: 1_100 * Q - 71_054,\n    });\n    const speed = patch(round, {\n      player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      bankedStars: 5,\n      shadows: [{ id: 0, centerQ: { x: 1_800 * Q, y: 800 * Q }, graceTicks: 0 }],\n    });\n    expect((tick(speed).state as AnyState).shadows[0].centerQ.x).toBe(1_800 * Q - 104_857);\n  });\n\n  it('keeps shadows outside the lighthouse radial boundary', () => {\n    const round = createRound(1) as AnyState;\n    const state = patch(round, {\n      player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      shadows: [{ id: 0, centerQ: { x: 1_370 * Q, y: 800 * Q }, graceTicks: 0 }],\n    });\n    const next = tick(state).state as AnyState;\n    expect(next.shadows[0].centerQ).toEqual({ x: 1_200 * Q + 169 * Q, y: 800 * Q });\n  });\n\n  it('applies repel at the inclusive radius and records both axes', () => {\n    const round = createRound(1) as AnyState;\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const state = patch(round, {\n      player: { centerQ: player },\n      shadows: [\n        {\n          id: 0,\n          centerQ: { x: player.x + 109 * Q + 100_488, y: player.y + 109 * Q + 100_488 },\n          graceTicks: 0,\n        },\n      ],\n    });\n    const next = tick(state).state as AnyState;\n    expect(next.shadows[0].graceTicks).toBe(21);\n    expect(next.shadows[0].centerQ.y).toBeGreaterThan(state.shadows[0].centerQ.y);\n  });\n\n  it('collides at the inclusive radius only when the lantern is empty', () => {\n    const round = createRound(1) as AnyState;\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const shadow = {\n      id: 0,\n      centerQ: { x: player.x + 37 * Q + 100_488, y: player.y },\n      graceTicks: 0,\n    };\n    expect(\n      (\n        tick(\n          patch(round, {\n            player: { centerQ: player },\n            lantern: { energyUnits: 0 },\n            shadows: [shadow],\n          }),\n        ).state as AnyState\n      ).phase,\n    ).toBe('lost');\n    expect(\n      (\n        tick(\n          patch(round, {\n            player: { centerQ: player },\n            lantern: { energyUnits: 100 },\n            shadows: [shadow],\n          }),\n        ).state as AnyState\n      ).phase,\n    ).toBe('playing');\n  });\n\n  it('decrements ordinary shadow grace and never decrements newly spawned grace', () => {\n    const round = createRound(1) as AnyState;\n    const ordinary = patch(round, {\n      shadows: [{ id: 0, centerQ: { x: 1_800 * Q, y: 800 * Q }, graceTicks: 5 }],\n    });\n    expect((tick(ordinary).state as AnyState).shadows[0].graceTicks).toBe(4);\n    const fresh = patch(round, { tick: 719, shadows: [] });\n    expect((tick(fresh).state as AnyState).shadows[0].graceTicks).toBe(21);\n  });\n\n  it('spawns on the exact 720-tick cadence and respects the banked-star cap', () => {\n    const round = createRound(1) as AnyState;\n    const atCadence = patch(round, {\n      tick: 2_519,\n      shadows: [],\n      player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n    });\n    const spawned = tick(atCadence).state as AnyState;\n    expect(spawned.tick).toBe(2_520);\n    expect(spawned.shadows).toHaveLength(1);\n    expect(spawned.shadows[0].id).toBe(0);\n    const capped = patch(atCadence, {\n      bankedStars: 0,\n      shadows: [\n        { id: 0, centerQ: { x: 2_000 * Q, y: 800 * Q }, graceTicks: 21 },\n        { id: 1, centerQ: { x: 2_100 * Q, y: 800 * Q }, graceTicks: 21 },\n      ],\n    });\n    expect((tick(capped).state as AnyState).shadows).toHaveLength(2);\n  });\n\n  it('creates and consumes a pending respawn only when the total star count is below 28', () => {\n    const round = createRound(1) as AnyState;\n    const low = patch(round, {\n      tick: 719,\n      availableStars: round.availableStars.slice(0, 27),\n      carriedStars: [],\n    });\n    const lowNext = tick(low).state as AnyState;\n    expect(lowNext.availableStars).toHaveLength(28);\n    expect(lowNext.pendingStarRespawn).toBeUndefined();\n    const full = patch(round, {\n      tick: 719,\n      availableStars: round.availableStars.slice(0, 28),\n      carriedStars: [],\n    });\n    expect((tick(full).state as AnyState).pendingStarRespawn).toBeUndefined();\n  });\n\n  it('picks up only within the inclusive radius and never exceeds five carried stars', () => {\n    const round = createRound(1) as AnyState;\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const star = { id: 99, centerQ: { x: player.x + 34 * Q, y: player.y } };\n    const picked = tick(\n      patch(round, { player: { centerQ: player }, availableStars: [star], carriedStars: [] }),\n    ).state as AnyState;\n    expect(picked.carriedStars).toEqual([99]);\n    expect(picked.availableStars).toEqual([]);\n    const notPicked = tick(\n      patch(round, {\n        player: { centerQ: player },\n        availableStars: [{ ...star, centerQ: { x: player.x + 35 * Q, y: player.y } }],\n        carriedStars: [],\n      }),\n    ).state as AnyState;\n    expect(notPicked.carriedStars).toEqual([]);\n    expect(\n      (\n        tick(\n          patch(round, {\n            player: { centerQ: player },\n            availableStars: [star],\n            carriedStars: [1, 2, 3, 4, 5],\n          }),\n        ).state as AnyState\n      ).carriedStars,\n    ).toHaveLength(5);\n  });\n\n  it('deposits at the inclusive radius and wins at exactly twenty banked stars', () => {\n    const round = createRound(1) as AnyState;\n    const edge = patch(round, {\n      player: { centerQ: { x: 1_200 * Q + 132 * Q, y: 800 * Q } },\n      carriedStars: [1],\n      bankedStars: 19,\n    });\n    const next = tick(edge).state as AnyState;\n    expect(next.bankedStars).toBe(20);\n    expect(next.carriedStars).toEqual([]);\n    expect(next.phase).toBe('won');\n    expect(next.lantern.energyUnits).toBe(MAX_ENERGY_UNITS);\n  });\n});\n\ndescribe('mutation-gap respawn geometry contracts', () => {\n  it('rejects each forbidden star neighborhood before accepting a safe candidate', () => {\n    const base = createRound(1) as AnyState;\n    const state = patch(base, {\n      availableStars: [{ id: 1, centerQ: { x: 2_100 * Q, y: 1_200 * Q } }],\n      shadows: [{ id: 2, centerQ: { x: 1_800 * Q, y: 1_200 * Q }, graceTicks: 0 }],\n      pendingStarRespawn: { dueTick: 10 },\n      nextStarId: 28,\n    });\n    const candidates = [\n      { centerQ: { x: 1_500 * Q, y: 800 * Q }, rngState: 1 },\n      { centerQ: { x: 1_200 * Q + 259 * Q, y: 800 * Q }, rngState: 2 },\n      { centerQ: { x: 1_800 * Q + 179 * Q, y: 1_200 * Q }, rngState: 3 },\n      { centerQ: { x: 2_100 * Q + 100 * Q, y: 1_200 * Q }, rngState: 4 },\n      { centerQ: { x: 1_600 * Q, y: 1_200 * Q }, rngState: 5 },\n    ];\n    let index = 0;\n    const next = attemptStarRespawn(state, {\n      currentTick: 10,\n      nextCandidate: () => candidates[index++]!,\n    });\n    expect(index).toBe(5);\n    expect(next.availableStars.at(-1)).toMatchObject({\n      id: 28,\n      centerQ: { x: 1_600 * Q, y: 1_200 * Q },\n    });\n    expect(next.pendingStarRespawn).toBeUndefined();\n  });\n\n  it('defers a missing candidate source safely and retries after the documented delay', () => {\n    const base = createRound(1) as AnyState;\n    const state = patch(base, {\n      pendingStarRespawn: { dueTick: 10 },\n      availableStars: [],\n      nextStarId: 28,\n    });\n    const next = attemptStarRespawn(state, {\n      currentTick: 10,\n      nextCandidate: () => ({ centerQ: { x: 1_200 * Q, y: 800 * Q }, rngState: 99 }),\n    });\n    expect(next.pendingStarRespawn?.dueTick).toBe(70);\n    expect(next.nextStarId).toBe(28);\n  });\n\n  it('enforces every inclusive respawn boundary and expanded obstacle boundary', () => {\n    const makeState = (changes: AnyState = {}) =>\n      patch(createRound(1), {\n        availableStars: [],\n        shadows: [],\n        obstacles: [],\n        pendingStarRespawn: { dueTick: 10 },\n        nextStarId: 40,\n        ...changes,\n      });\n    const attempt = (centerQ: AnyState, changes: AnyState = {}) =>\n      attemptStarRespawn(makeState(changes), {\n        currentTick: 10,\n        nextCandidate: () => ({ centerQ, rngState: 7 }),\n      });\n    const accepted = (centerQ: AnyState, changes: AnyState = {}) => {\n      const result = attempt(centerQ, changes);\n      expect(result.availableStars).toHaveLength((changes.availableStars ?? []).length + 1);\n      expect(result.pendingStarRespawn).toBeUndefined();\n    };\n    const rejected = (centerQ: AnyState, changes: AnyState = {}) => {\n      const result = attempt(centerQ, changes);\n      expect(result.availableStars).toEqual(changes.availableStars ?? []);\n      expect(result.pendingStarRespawn?.dueTick).toBe(70);\n    };\n\n    rejected({ x: 1_500 * Q, y: 800 * Q });\n    accepted({ x: 1_501 * Q, y: 800 * Q });\n    rejected(\n      { x: 1_800 * Q - 259 * Q, y: 800 * Q },\n      {\n        player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n      },\n    );\n    accepted(\n      { x: 1_800 * Q - 260 * Q, y: 800 * Q },\n      {\n        player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n      },\n    );\n    rejected(\n      { x: 1_800 * Q + 179 * Q, y: 1_200 * Q },\n      {\n        shadows: [{ id: 1, centerQ: { x: 1_800 * Q, y: 1_200 * Q }, graceTicks: 0 }],\n      },\n    );\n    accepted(\n      { x: 1_800 * Q + 180 * Q, y: 1_200 * Q },\n      {\n        shadows: [{ id: 1, centerQ: { x: 1_800 * Q, y: 1_200 * Q }, graceTicks: 0 }],\n      },\n    );\n    rejected(\n      { x: 2_200 * Q, y: 1_200 * Q },\n      {\n        availableStars: [{ id: 1, centerQ: { x: 2_100 * Q, y: 1_200 * Q } }],\n      },\n    );\n    accepted(\n      { x: 2_201 * Q, y: 1_200 * Q },\n      {\n        availableStars: [{ id: 1, centerQ: { x: 2_100 * Q, y: 1_200 * Q } }],\n      },\n    );\n    rejected({ x: 33 * Q, y: 800 * Q });\n    accepted({ x: 34 * Q, y: 800 * Q });\n    rejected({ x: 2_367 * Q, y: 800 * Q });\n    accepted({ x: 2_366 * Q, y: 800 * Q });\n    rejected({ x: 1_200 * Q, y: 33 * Q });\n    accepted({ x: 1_200 * Q, y: 34 * Q });\n    rejected({ x: 1_200 * Q, y: 1_567 * Q });\n    accepted({ x: 1_200 * Q, y: 1_566 * Q });\n\n    const obstacle = { id: 0, x: 100, y: 100, width: 160, height: 128 };\n    rejected({ x: 66 * Q, y: 200 * Q }, { obstacles: [obstacle] });\n    accepted({ x: 65 * Q, y: 200 * Q }, { obstacles: [obstacle] });\n    rejected({ x: 200 * Q, y: 66 * Q }, { obstacles: [obstacle] });\n    accepted({ x: 200 * Q, y: 65 * Q }, { obstacles: [obstacle] });\n  });\n});\n\ndescribe('mutation-gap reducer boundary contracts', () => {\n  it('distinguishes fresh shadows from existing shadows during a spawn tick', () => {\n    const round = createRound(1) as AnyState;\n    const state = patch(round, {\n      tick: 719,\n      nextShadowId: 1,\n      shadows: [{ id: 0, centerQ: { x: 1_800 * Q, y: 800 * Q }, graceTicks: 5 }],\n    });\n    const next = tick(state).state as AnyState;\n    expect(next.shadows).toHaveLength(2);\n    expect(next.shadows.find((shadow: AnyState) => shadow.id === 1).graceTicks).toBe(21);\n    expect(next.shadows.find((shadow: AnyState) => shadow.id === 0).graceTicks).toBe(4);\n  });\n\n  it('uses banked-star shadow capacity and preserves the spawn position and ID', () => {\n    const round = createRound(1) as AnyState;\n    const state = patch(round, {\n      tick: 2_519,\n      bankedStars: 10,\n      nextShadowId: 40,\n      shadows: [\n        { id: 3, centerQ: { x: 2_000 * Q, y: 800 * Q }, graceTicks: 21 },\n        { id: 4, centerQ: { x: 2_100 * Q, y: 800 * Q }, graceTicks: 21 },\n        { id: 5, centerQ: { x: 2_200 * Q, y: 800 * Q }, graceTicks: 21 },\n      ],\n      player: { centerQ: { x: 1_000 * Q, y: 700 * Q } },\n    });\n    const next = tick(state).state as AnyState;\n    expect(next.shadows).toHaveLength(4);\n    expect(next.shadows.at(-1)).toMatchObject({\n      id: 40,\n      centerQ: { x: 1_600 * Q - 109_226, y: 700 * Q },\n    });\n    expect(next.nextShadowId).toBe(41);\n  });\n\n  it('does not create a respawn before cadence or when total stars are already at capacity', () => {\n    const round = createRound(1) as AnyState;\n    const before = patch(round, { tick: 719, availableStars: [], carriedStars: [] });\n    expect(tick(before).state.pendingStarRespawn).toBeUndefined();\n    const full = patch(round, {\n      tick: 719,\n      availableStars: round.availableStars,\n      carriedStars: [99],\n      player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n    });\n    const next = tick(full).state as AnyState;\n    expect(next.availableStars).toHaveLength(28);\n    expect(next.carriedStars).toEqual([99]);\n    expect(next.pendingStarRespawn).toBeUndefined();\n  });\n\n  it('distinguishes safe-zone and collision boundaries and reports gameplay events', () => {\n    const round = createRound(1) as AnyState;\n    const safeEdge = patch(round, {\n      player: { centerQ: { x: 1_200 * Q + 150 * Q, y: 800 * Q } },\n      lantern: { energyUnits: 1_000 },\n    });\n    expect((tick(safeEdge).state as AnyState).lantern.energyUnits).toBe(1_400);\n    const unsafe = patch(round, {\n      player: { centerQ: { x: 1_200 * Q + 151 * Q, y: 800 * Q } },\n      lantern: { energyUnits: 1_000 },\n    });\n    expect((tick(unsafe).state as AnyState).lantern.energyUnits).toBe(952);\n\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const star = { id: 99, centerQ: { x: player.x + 10 * Q, y: player.y } };\n    const picked = tick(patch(round, { player: { centerQ: player }, availableStars: [star] }));\n    expect(picked.events).toEqual([{ kind: 'pickup' }]);\n    const deposited = tick(\n      patch(round, {\n        player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n        carriedStars: [99],\n      }),\n    );\n    expect(deposited.events).toEqual([{ kind: 'deposit' }]);\n  });\n\n  it('uses diagonal radial correction output rather than only its x coordinate', () => {\n    const round = createRound(1) as AnyState;\n    const state = patch(round, {\n      player: { centerQ: { x: 1_200 * Q, y: 800 * Q } },\n      shadows: [{ id: 0, centerQ: { x: 1_320 * Q, y: 920 * Q }, graceTicks: 0 }],\n    });\n    const next = tick(state).state as AnyState;\n    expect(next.shadows[0].centerQ).toEqual({ x: 86_474_660, y: 60_260_260 });\n  });\n});\n\ndescribe('mutation-gap reducer terminal and cadence contracts', () => {\n  it('returns terminal states unchanged without events', () => {\n    const round = createRound(1) as AnyState;\n    for (const phase of ['won', 'lost'] as const) {\n      const state = patch(round, { phase, tick: 42 });\n      const transition = tick(state, EAST);\n      expect(transition.state).toBe(state);\n      expect(transition.events).toEqual([]);\n    }\n  });\n\n  it('distinguishes the exact shadow capacity at five banked stars', () => {\n    const round = createRound(1) as AnyState;\n    const state = patch(round, {\n      tick: 2_519,\n      bankedStars: 5,\n      shadows: [\n        { id: 0, centerQ: { x: 1_900 * Q, y: 800 * Q }, graceTicks: 21 },\n        { id: 1, centerQ: { x: 2_000 * Q, y: 800 * Q }, graceTicks: 21 },\n        { id: 2, centerQ: { x: 2_100 * Q, y: 800 * Q }, graceTicks: 21 },\n      ],\n    });\n    expect((tick(state).state as AnyState).shadows).toHaveLength(3);\n  });\n});\n\ndescribe('mutation-gap respawn upper obstacle boundaries', () => {\n  it('distinguishes every upper clearance edge of an obstacle', () => {\n    const obstacle = { id: 0, x: 100, y: 100, width: 160, height: 128 };\n    const attempt = (centerQ: AnyState) =>\n      attemptStarRespawn(\n        patch(createRound(1), {\n          availableStars: [],\n          shadows: [],\n          obstacles: [obstacle],\n          pendingStarRespawn: { dueTick: 10 },\n        }),\n        { currentTick: 10, nextCandidate: () => ({ centerQ, rngState: 1 }) },\n      );\n    expect(attempt({ x: 294 * Q, y: 200 * Q }).pendingStarRespawn).toBeDefined();\n    expect(attempt({ x: 295 * Q, y: 200 * Q }).availableStars).toHaveLength(1);\n    expect(attempt({ x: 200 * Q, y: 262 * Q }).pendingStarRespawn).toBeDefined();\n    expect(attempt({ x: 200 * Q, y: 263 * Q }).availableStars).toHaveLength(1);\n    expect(attempt({ x: 250 * Q, y: 220 * Q }).pendingStarRespawn).toBeDefined();\n    expect(attempt({ x: 220 * Q, y: 250 * Q }).pendingStarRespawn).toBeDefined();\n  });\n});\n"},"tests/unit/complete-mutation.contract.test.ts":{"tests":[{"id":"65","name":"keyboard source behavior keeps touch active when the newer keyboard state cancels to zero"},{"id":"66","name":"keyboard source behavior does not let unsupported or repeated keys steal source priority"},{"id":"67","name":"keyboard source behavior keeps a re-engaged touch newer after releasing the previous touch"},{"id":"68","name":"keyboard source behavior re-evaluates the complete supported-code table and zero vector"},{"id":"69","name":"RNG rejection behavior rejects a range whose width reaches the 32-bit domain"},{"id":"70","name":"RNG rejection behavior rejects an output exactly at the unbiased limit before mapping it"},{"id":"71","name":"RNG rejection behavior rejects a large first output for a span with a wide rejection region"},{"id":"72","name":"world and reducer behavior re-evaluates every fixed obstacle row after module reset"},{"id":"73","name":"world and reducer behavior uses every deterministic fallback direction for a coincident shadow"},{"id":"74","name":"world and reducer behavior re-evaluates reducer helper functions after module reset"},{"id":"75","name":"world and reducer behavior distinguishes exact lighthouse and repel radial boundaries"},{"id":"76","name":"world and reducer behavior spawns only on cadence and only below the exact capacity"},{"id":"77","name":"world and reducer behavior does not schedule a respawn when exactly 28 stars exist"},{"id":"78","name":"world and reducer behavior retains unpicked stars and reports exact terminal events"},{"id":"79","name":"world and reducer behavior does not collide with an empty lantern when every shadow is far away"},{"id":"80","name":"star respawn identity is a strict no-op without a due request"},{"id":"81","name":"star respawn identity does not consume a request before its due tick"},{"id":"82","name":"star respawn identity allocates the current ID and advances it exactly once"},{"id":"83","name":"audio failure containment activates once and schedules only while available, unmuted, and unpaused"},{"id":"84","name":"audio failure containment keeps optional context, schedule, suspend, and close methods optional"},{"id":"85","name":"audio failure containment disables once when scheduling fails even when cleanup also fails"},{"id":"86","name":"platform boundaries keeps exact-radius thumb quantization stable"},{"id":"87","name":"platform boundaries uses system reduced motion when available and safely defaults when absent"},{"id":"88","name":"platform boundaries preserves partial scheduler accumulation and the inclusive epsilon boundary"},{"id":"89","name":"platform boundaries starts visible, pauses only on hidden, and tolerates absent audio suspension"},{"id":"90","name":"storage schema constants and rejection re-evaluates defaults and the versioned storage key"},{"id":"91","name":"storage schema constants and rejection accepts every reduced-motion enum and rejects primitives without writes"}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { Q } from '../../src/game/constants';\nimport { createInputController } from '../../src/game/input';\nimport { advance } from '../../src/game/reducer';\nimport { createRng } from '../../src/game/rng';\nimport { attemptStarRespawn } from '../../src/game/spawn';\nimport { createRound } from '../../src/game/world';\nimport { createAudioController } from '../../src/platform/audio';\nimport { quantizeThumbVector } from '../../src/platform/input';\nimport { resolveReducedMotion } from '../../src/platform/preferences';\nimport { createFixedStepScheduler } from '../../src/platform/scheduler';\nimport { loadPreferences, savePreferences } from '../../src/platform/storage';\nimport { createVisibilityController } from '../../src/platform/visibility';\n\ntype AnyState = any;\nconst STILL = { x: 0, y: 0 } as const;\n\nfunction tick(state: AnyState, movementQ: { x: number; y: number } = STILL) {\n  return advance(state, { kind: 'tick', movementQ });\n}\n\nfunction storage(overrides: Partial<"+"Storage> = {}): Storage {\n  return {\n    getItem: vi.fn(() => null),\n    setItem: vi.fn(),\n    removeItem: vi.fn(),\n    clear: vi.fn(),\n    key: vi.fn(() => null),\n    get length() {\n      return 0;\n    },\n    ...overrides,\n  } as Storage;\n}\n\ndescribe('keyboard source behavior', () => {\n  it('keeps touch active when the newer keyboard state cancels to zero', () => {\n    const input = createInputController();\n    input.setTouch({ x: Q, y: 0 });\n    input.keyDown('ArrowUp');\n    input.keyDown('ArrowDown');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n  });\n\n  it('does not let unsupported or repeated keys steal source priority', () => {\n    const input = createInputController();\n    input.keyDown('ArrowLeft');\n    input.setTouch({ x: Q, y: 0 });\n    input.keyDown('unsupported');\n    input.keyDown('ArrowLeft');\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n  });\n\n  it('keeps a re-engaged touch newer after releasing the previous touch', () => {\n    const input = createInputController();\n    input.setTouch({ x: Q, y: 0 });\n    input.keyDown('ArrowUp');\n    input.releaseTouch();\n    input.setTouch({ x: Q, y: 0 });\n    expect(input.movementForTick()).toEqual({ x: Q, y: 0 });\n  });\n\n  it('re-evaluates the complete supported-code table and zero vector', async () => {\n    vi.resetModules();\n    const fresh = await import('../../src/game/input');\n    for (const [code, expected] of [\n      ['ArrowUp', { x: 0, y: -Q }],\n      ['ArrowDown', { x: 0, y: Q }],\n      ['ArrowLeft', { x: -Q, y: 0 }],\n      ['ArrowRight', { x: Q, y: 0 }],\n      ['KeyW', { x: 0, y: -Q }],\n      ['KeyA', { x: -Q, y: 0 }],\n      ['KeyS', { x: 0, y: Q }],\n      ['KeyD', { x: Q, y: 0 }],\n    ] as const) {\n      const input = fresh.createInputController();\n      expect(input.movementForTick()).toEqual({ x: 0, y: 0 });\n      input.keyDown(code);\n      expect(input.movementForTick()).toEqual(expected);\n    }\n  });\n});\n\ndescribe('RNG rejection behavior', () => {\n  it('rejects a range whose width reaches the 32-bit domain', () => {\n    expect(() => createRng(1).int(0, 2 ** 32)).toThrow('invalid rng range');\n    expect(() => createRng(1).int(-(2 ** 31), 2 ** 31)).toThrow('invalid rng range');\n  });\n\n  it('rejects an output exactly at the unbiased limit before mapping it', () => {\n    const rng = createRng(1_584_200_935);\n    expect(rng.nextU32()).toBe(0xffff_ffff);\n    const retried = createRng(1_584_200_935);\n    expect(retried.int(0, 4)).toBe(3);\n    expect(retried.state()).toBe(253_983);\n  });\n\n  it('rejects a large first output for a span with a wide rejection region', () => {\n    const rng = createRng(8_192);\n    expect(rng.int(0, 2_147_483_648)).toBe(13_148_770);\n  });\n});\n\ndescribe('world and reducer behavior', () => {\n  it('re-evaluates every fixed obstacle row after module reset', async () => {\n    vi.resetModules();\n    const fresh = await import('../../src/game/world');\n    expect(\n      fresh\n        .createRound(1)\n        .obstacles.map(({ id, x, y, width, height }) => [id, x, y, width, height]),\n    ).toEqual([\n      [0, 100, 100, 160, 128],\n      [1, 420, 100, 176, 112],\n      [2, 760, 100, 144, 160],\n      [3, 1080, 100, 160, 128],\n      [4, 1400, 100, 176, 112],\n      [5, 1740, 100, 144, 160],\n      [6, 2060, 100, 160, 128],\n      [7, 100, 420, 160, 128],\n      [8, 2140, 420, 160, 128],\n      [9, 100, 740, 160, 128],\n      [10, 2140, 740, 160, 128],\n      [11, 100, 1060, 160, 128],\n      [12, 2140, 1060, 160, 128],\n      [13, 100, 1380, 160, 128],\n      [14, 420, 1380, 176, 112],\n      [15, 760, 1380, 144, 140],\n      [16, 1080, 1380, 160, 128],\n      [17, 1400, 1380, 176, 112],\n      [18, 1740, 1380, 144, 140],\n      [19, 2060, 1380, 160, 128],\n      [20, 400, 620, 112, 112],\n      [21, 1888, 620, 112, 112],\n      [22, 400, 940, 112, 112],\n      [23, 1888, 940, 112, 112],\n    ]);\n  });\n\n  it('uses every deterministic fallback direction for a coincident shadow', () => {\n    const origin = { x: 1_800 * Q, y: 800 * Q };\n    const offsets: ReadonlyArray<"+"readonly [number, number]> = [\n      [100_488, 0],\n      [71_056, 71_056],\n      [0, 100_488],\n      [-71_056, 71_056],\n      [-100_488, 0],\n      [-71_056, -71_056],\n      [0, -100_488],\n      [71_056, -71_056],\n    ];\n    for (let id = 0; id <"+" offsets.length; id += 1) {\n      const state = {\n        ...createRound(1),\n        player: { centerQ: origin },\n        lantern: { energyUnits: 0 },\n        shadows: [{ id, centerQ: origin, graceTicks: 10 }],\n      } as AnyState;\n      const next = tick(state).state as AnyState;\n      expect(next.shadows[0].centerQ).toEqual({\n        x: origin.x + offsets[id]![0],\n        y: origin.y + offsets[id]![1],\n      });\n    }\n  });\n\n  it('re-evaluates reducer helper functions after module reset', async () => {\n    vi.resetModules();\n    const [{ advance: freshAdvance }, { createRound: freshRound }] = await Promise.all([\n      import('../../src/game/reducer'),\n      import('../../src/game/world'),\n    ]);\n    const state = {\n      ...freshRound(1),\n      player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n      lantern: { energyUnits: 1_000 },\n      shadows: [{ id: 2, centerQ: { x: 2_000 * Q, y: 800 * Q }, graceTicks: 10 }],\n    };\n    const next = freshAdvance(state, { kind: 'tick', movementQ: STILL }).state;\n    expect(next.tick).toBe(1);\n    expect(next.lantern.energyUnits).toBe(952);\n    expect(next.shadows[0]!.centerQ.x).toBe(2_000 * Q - 100_488);\n\n    const safeState = { ...freshRound(2), lantern: { energyUnits: 1_000 } };\n    expect(\n      freshAdvance(safeState, { kind: 'tick', movementQ: STILL }).state.lantern.energyUnits,\n    ).toBe(1_400);\n  });\n\n  it('distinguishes exact lighthouse and repel radial boundaries', () => {\n    const round = createRound(1) as AnyState;\n    const lighthouseTarget = { x: 1_200 * Q + 65 * Q, y: 800 * Q + 156 * Q };\n    const lighthouseState = {\n      ...round,\n      player: { centerQ: { x: lighthouseTarget.x - 100 * Q, y: lighthouseTarget.y } },\n      lantern: { energyUnits: 0 },\n      shadows: [\n        {\n          id: 3,\n          centerQ: { x: lighthouseTarget.x + 100_488, y: lighthouseTarget.y },\n          graceTicks: 10,\n        },\n      ],\n    };\n    expect((tick(lighthouseState).state as AnyState).shadows[0].centerQ).toEqual(lighthouseTarget);\n\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const repelState = {\n      ...round,\n      player: { centerQ: player },\n      lantern: { energyUnits: 1_000 },\n      shadows: [\n        {\n          id: 4,\n          centerQ: { x: player.x + 155 * Q + 100_488, y: player.y },\n          graceTicks: 0,\n        },\n      ],\n    };\n    expect((tick(repelState).state as AnyState).shadows[0].graceTicks).toBe(21);\n  });\n\n  it('spawns only on cadence and only below the exact capacity', () => {\n    const round = createRound(1) as AnyState;\n    const beforeCadence = { ...round, tick: 718, shadows: [] };\n    expect((tick(beforeCadence).state as AnyState).shadows).toEqual([]);\n    const offCadence = { ...round, tick: 720, shadows: [] };\n    expect((tick(offCadence).state as AnyState).shadows).toEqual([]);\n    const atCapacity = {\n      ...round,\n      tick: 2_519,\n      bankedStars: 0,\n      shadows: [\n        { id: 0, centerQ: { x: 2_000 * Q, y: 800 * Q }, graceTicks: 22 },\n        { id: 1, centerQ: { x: 2_100 * Q, y: 800 * Q }, graceTicks: 22 },\n      ],\n    };\n    expect((tick(atCapacity).state as AnyState).shadows).toHaveLength(2);\n  });\n\n  it('does not schedule a respawn when exactly 28 stars exist', () => {\n    const round = createRound(1) as AnyState;\n    const state = {\n      ...round,\n      tick: 719,\n      player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n      availableStars: round.availableStars.slice(0, 27),\n      carriedStars: [99],\n    };\n    const next = tick(state).state as AnyState;\n    expect(next.availableStars).toHaveLength(27);\n    expect(next.carriedStars).toEqual([99]);\n    expect(next.pendingStarRespawn).toBeUndefined();\n  });\n\n  it('retains unpicked stars and reports exact terminal events', () => {\n    const round = createRound(1) as AnyState;\n    const player = { x: 1_800 * Q, y: 800 * Q };\n    const pickup = tick({\n      ...round,\n      player: { centerQ: player },\n      availableStars: [\n        { id: 90, centerQ: player },\n        { id: 91, centerQ: { x: 2_200 * Q, y: 1_200 * Q } },\n      ],\n    });\n    expect(pickup.state.availableStars.map((star: AnyState) => star.id)).toEqual([91]);\n    expect(pickup.events).toEqual([{ kind: 'pickup' }]);\n\n    const won = tick({ ...round, carriedStars: [90], bankedStars: 19 });\n    expect(won.events).toEqual([{ kind: 'deposit' }, { kind: 'won' }]);\n\n    const lost = tick({\n      ...round,\n      player: { centerQ: player },\n      lantern: { energyUnits: 0 },\n      shadows: [{ id: 7, centerQ: player, graceTicks: 0 }],\n    });\n    expect(lost.events).toEqual([{ kind: 'lost' }]);\n  });\n\n  it('does not collide with an empty lantern when every shadow is far away', () => {\n    const round = createRound(1) as AnyState;\n    const next = tick({\n      ...round,\n      player: { centerQ: { x: 1_800 * Q, y: 800 * Q } },\n      lantern: { energyUnits: 0 },\n      shadows: [{ id: 1, centerQ: { x: 2_200 * Q, y: 1_200 * Q }, graceTicks: 0 }],\n    }).state as AnyState;\n    expect(next.phase).toBe('playing');\n  });\n});\n\ndescribe('star respawn identity', () => {\n  it('is a strict no-op without a due request', () => {\n    const state = createRound(1);\n    const nextCandidate = vi.fn(() => ({ centerQ: { x: 2_100 * Q, y: 1_200 * Q }, rngState: 2 }));\n    expect(attemptStarRespawn(state, { currentTick: 0, nextCandidate })).toBe(state);\n    expect(nextCandidate).not.toHaveBeenCalled();\n  });\n\n  it('does not consume a request before its due tick', () => {\n    const state = { ...createRound(1), pendingStarRespawn: { dueTick: 11 } };\n    const nextCandidate = vi.fn(() => ({ centerQ: { x: 1_600 * Q, y: 1_200 * Q }, rngState: 2 }));\n    expect(attemptStarRespawn(state, { currentTick: 10, nextCandidate })).toBe(state);\n    expect(nextCandidate).not.toHaveBeenCalled();\n  });\n\n  it('allocates the current ID and advances it exactly once', () => {\n    const state = {\n      ...createRound(1),\n      availableStars: [],\n      shadows: [],\n      pendingStarRespawn: { dueTick: 10 },\n      nextStarId: 40,\n    };\n    const next = attemptStarRespawn(state, {\n      currentTick: 10,\n      nextCandidate: () => ({ centerQ: { x: 1_600 * Q, y: 1_200 * Q }, rngState: 7 }),\n    });\n    expect(next.availableStars).toEqual([{ id: 40, centerQ: { x: 1_600 * Q, y: 1_200 * Q } }]);\n    expect(next.nextStarId).toBe(41);\n  });\n});\n\ndescribe('audio failure containment', () => {\n  it('activates once and schedules only while available, unmuted, and unpaused', () => {\n    const close = vi.fn();\n    const suspend = vi.fn();\n    const createContext = vi.fn(() => ({ close, suspend }));\n    const schedule = vi.fn();\n    const audio = createAudioController({ createContext, schedule });\n    audio.activate();\n    audio.activate();\n    audio.play('pickup');\n    expect(createContext).toHaveBeenCalledTimes(1);\n    expect(schedule).toHaveBeenCalledWith('pickup');\n    audio.setMuted(true);\n    audio.play('muted');\n    audio.setMuted(false);\n    audio.setPaused(true);\n    audio.play('paused');\n    audio.setPaused(false);\n    audio.play('resumed');\n    expect(schedule.mock.calls.map(([sound]) => sound)).toEqual(['pickup', 'resumed']);\n    expect(suspend).toHaveBeenCalledTimes(1);\n  });\n\n  it('keeps optional context, schedule, suspend, and close methods optional', () => {\n    const scheduleBeforeGesture = vi.fn();\n    const beforeActivation = createAudioController({\n      createContext: () => ({}),\n      schedule: scheduleBeforeGesture,\n    });\n    beforeActivation.play('before-gesture');\n    expect(scheduleBeforeGesture).not.toHaveBeenCalled();\n    beforeActivation.setPaused(true);\n    expect(beforeActivation.isAvailable()).toBe(true);\n    beforeActivation.activate();\n    beforeActivation.setPaused(false);\n    beforeActivation.play('pickup');\n    expect(beforeActivation.isAvailable()).toBe(true);\n    beforeActivation.setPaused(true);\n    expect(beforeActivation.isAvailable()).toBe(true);\n\n    const noSchedule = createAudioController({ createContext: () => ({}) });\n    noSchedule.activate();\n    noSchedule.play('optional-schedule');\n    expect(noSchedule.isAvailable()).toBe(true);\n\n    const failedCreation = createAudioController({\n      createContext: () => {\n        throw new Error('blocked');\n      },\n    });\n    failedCreation.activate();\n    expect(failedCreation.isAvailable()).toBe(false);\n  });\n\n  it('disables once when scheduling fails even when cleanup also fails', () => {\n    const close = vi.fn(() => {\n      throw new Error('close failed');\n    });\n    const suspend = vi.fn(() => {\n      throw new Error('suspend failed');\n    });\n    const audio = createAudioController({\n      createContext: () => ({ close, suspend }),\n      schedule: () => {\n        throw new Error('schedule failed');\n      },\n    });\n    audio.activate();\n    audio.play('loss');\n    audio.setPaused(true);\n    expect(audio.isAvailable()).toBe(false);\n    expect(audio.notices()).toEqual(['audio-unavailable']);\n    expect(close).toHaveBeenCalledTimes(2);\n    expect(suspend).toHaveBeenCalledTimes(1);\n  });\n});\n\ndescribe('platform boundaries', () => {\n  it('keeps exact-radius thumb quantization stable', () => {\n    expect(quantizeThumbVector(44 * 256, 0)).toEqual({ x: Q, y: 0 });\n    expect(quantizeThumbVector(0, 0)).toEqual({ x: 0, y: 0 });\n  });\n\n  it('uses system reduced motion when available and safely defaults when absent', () => {\n    expect(resolveReducedMotion('system', () => true)).toBe(true);\n    expect(resolveReducedMotion('system')).toBe(false);\n  });\n\n  it('preserves partial scheduler accumulation and the inclusive epsilon boundary', () => {\n    const onTick = vi.fn();\n    const scheduler = createFixedStepScheduler({ onTick });\n    scheduler.frame(1 / 120);\n    expect(onTick).not.toHaveBeenCalled();\n    scheduler.frame(1 / 120);\n    expect(onTick).toHaveBeenCalledTimes(1);\n\n    const epsilonTick = vi.fn();\n    createFixedStepScheduler({ onTick: epsilonTick }).frame(1 / 60 - 1e-12);\n    expect(epsilonTick).toHaveBeenCalledTimes(1);\n  });\n\n  it('starts visible, pauses only on hidden, and tolerates absent audio suspension', () => {\n    const onPause = vi.fn();\n    const onResume = vi.fn();\n    const lifecycle = createVisibilityController({ onPause, onResume });\n    expect(lifecycle.requestResume()).toBe(true);\n    lifecycle.changedTo('visible');\n    expect(onPause).not.toHaveBeenCalled();\n    lifecycle.changedTo('hidden');\n    expect(onPause).toHaveBeenCalledTimes(1);\n    expect(() => lifecycle.pageHidden()).not.toThrow();\n  });\n});\n\ndescribe('storage schema constants and rejection', () => {\n  it('re-evaluates defaults and the versioned storage key', async () => {\n    vi.resetModules();\n    const fresh = await import('../../src/platform/storage');\n    expect(fresh.defaults).toEqual({\n      version: 1,\n      bestScore: 0,\n      muted: false,\n      highContrast: false,\n      reducedMotion: 'system',\n    });\n    const target = storage();\n    expect(fresh.savePreferences(target, { ...fresh.defaults, reducedMotion: 'on' })).toBe(true);\n    expect(target.setItem).toHaveBeenCalledWith(\n      'last-light:preferences:v1',\n      JSON.stringify({ ...fresh.defaults, reducedMotion: 'on' }),\n    );\n  });\n\n  it('accepts every reduced-motion enum and rejects primitives without writes', () => {\n    for (const reducedMotion of ['system', 'on', 'off'] as const) {\n      const value = { version: 1, bestScore: 0, muted: false, highContrast: false, reducedMotion };\n      expect(loadPreferences(storage({ getItem: vi.fn(() => JSON.stringify(value)) }))).toEqual({\n        ok: true,\n        value,\n      });\n    }\n    for (const invalid of [null, undefined, 0, 1, 'value', true, () => undefined]) {\n      const target = storage();\n      expect(savePreferences(target, invalid as never)).toBe(false);\n      expect(target.setItem).not.toHaveBeenCalled();\n    }\n\n    const complete = {\n      version: 1,\n      bestScore: 0,\n      muted: false,\n      highContrast: false,\n      reducedMotion: 'system' as const,\n    };\n    const nullPrototype = Object.assign(Object.create(null), complete);\n    const array = Object.assign([], complete);\n    class PreferenceRecord {\n      version = 1;\n      bestScore = 0;\n      muted = false;\n      highContrast = false;\n      reducedMotion = 'system' as const;\n    }\n    for (const invalid of [nullPrototype, array, new PreferenceRecord()]) {\n      const target = storage();\n      expect(savePreferences(target, invalid as never)).toBe(false);\n      expect(target.setItem).not.toHaveBeenCalled();\n    }\n  });\n});\n"},"tests/unit/rng.contract.test.ts":{"tests":[{"id":"92","name":"gameplay PRNG contract emits the exact xorshift32 sequence and exposes serializable state"},{"id":"93","name":"gameplay PRNG contract normalizes a zero seed to the documented nonzero fallback"},{"id":"94","name":"gameplay PRNG contract maps inclusive integer ranges without modulo bias"}],"source":"import { createRng } from '../../src/game/rng';\n\ndescribe('gameplay PRNG contract', () => {\n  it('emits the exact xorshift32 sequence and exposes serializable state', () => {\n    const rng = createRng(0x1234_5678);\n\n    expect([rng.nextU32(), rng.nextU32(), rng.nextU32(), rng.nextU32(), rng.nextU32()]).toEqual([\n      2_274_908_837, 358_294_691, 1_210_119_364, 2_176_035_992, 1_882_851_208,\n    ]);\n    expect(rng.state()).toBe(1_882_851_208);\n  });\n\n  it('normalizes a zero seed to the documented nonzero fallback', () => {\n    const zero = createRng(0);\n    const fallback = createRng(0x6d2b_79f5);\n\n    expect(zero.state()).toBe(fallback.state());\n    expect(zero.nextU32()).toBe(fallback.nextU32());\n  });\n\n  it('maps inclusive integer ranges without modulo bias', () => {\n    const rng = createRng(0xfeed_beef);\n    const values = Array.from({ length: 500 }, () => rng.int(-4, 4));\n\n    expect(values.every((value) => value >= -4 && value <"+"= 4)).toBe(true);\n    expect(values).toContain(-4);\n    expect(values).toContain(4);\n  });\n});\n"},"tests/unit/storage.contract.test.ts":{"tests":[{"id":"95","name":"versioned local preferences contract uses defaults for a missing key and round-trips only the validated schema"},{"id":"96","name":"versioned local preferences contract rejects not-json as invalid without throwing"},{"id":"97","name":"versioned local preferences contract rejects null as invalid without throwing"},{"id":"98","name":"versioned local preferences contract rejects [] as invalid without throwing"},{"id":"99","name":"versioned local preferences contract rejects {\"version\":2,\"bestScore\":0,\"muted\":false,\"highContrast\":false,\"reducedMotion\":\"system\"} as invalid without throwing"},{"id":"100","name":"versioned local preferences contract rejects {\"version\":1,\"bestScore\":-1,\"muted\":false,\"highContrast\":false,\"reducedMotion\":\"system\"} as invalid without throwing"},{"id":"101","name":"versioned local preferences contract rejects {\"version\":1,\"bestScore\":0,\"muted\":\"yes\",\"highContrast\":false,\"reducedMotion\":\"system\"} as invalid without throwing"},{"id":"102","name":"versioned local preferences contract rejects {\"version\":1,\"bestScore\":0,\"muted\":false,\"highContrast\":false,\"reducedMotion\":\"sometimes\"} as invalid without throwing"},{"id":"103","name":"versioned local preferences contract rejects xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx as invalid without throwing"},{"id":"104","name":"versioned local preferences contract treats get access failure as unavailable, not corrupt data"},{"id":"105","name":"versioned local preferences contract returns false for write failure and never claims a successful save"},{"id":"106","name":"versioned local preferences contract ignores unknown keys while retaining all known valid values"},{"id":"107","name":"reduced-motion preference precedence uses explicit local overrides before the OS media query"},{"id":"108","name":"reduced-motion preference precedence falls back to no preference when matchMedia is unavailable or throws"}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { loadPreferences, savePreferences } from '../../src/platform/storage';\nimport { resolveReducedMotion } from '../../src/platform/preferences';\n\nconst defaults = {\n  version: 1,\n  bestScore: 0,\n  muted: false,\n  highContrast: false,\n  reducedMotion: 'system' as const,\n};\n\nfunction storage(overrides: Partial<"+"Storage> = {}): Storage {\n  return {\n    getItem: vi.fn(() => null),\n    setItem: vi.fn(),\n    removeItem: vi.fn(),\n    clear: vi.fn(),\n    key: vi.fn(() => null),\n    get length() {\n      return 0;\n    },\n    ...overrides,\n  } as Storage;\n}\n\ndescribe('versioned local preferences contract', () => {\n  it('uses defaults for a missing key and round-trips only the validated schema', () => {\n    const target = storage();\n\n    expect(loadPreferences(target)).toEqual({ ok: true, value: defaults });\n    expect(savePreferences(target, { ...defaults, bestScore: 321 })).toBe(true);\n    expect(target.setItem).toHaveBeenCalledWith(\n      'last-light:preferences:v1',\n      JSON.stringify({ ...defaults, bestScore: 321 }),\n    );\n  });\n\n  it.each([\n    ['not-json', 'invalid'],\n    ['null', 'invalid'],\n    ['[]', 'invalid'],\n    [JSON.stringify({ ...defaults, version: 2 }), 'invalid'],\n    [JSON.stringify({ ...defaults, bestScore: -1 }), 'invalid'],\n    [JSON.stringify({ ...defaults, muted: 'yes' }), 'invalid'],\n    [JSON.stringify({ ...defaults, reducedMotion: 'sometimes' }), 'invalid'],\n    [`${'x'.repeat(1_025)}`, 'invalid'],\n  ])('rejects %s as %s without throwing', (payload, reason) => {\n    const target = storage({ getItem: vi.fn(() => payload) });\n\n    expect(loadPreferences(target)).toEqual({ ok: false, value: defaults, reason });\n  });\n\n  it('treats get access failure as unavailable, not corrupt data', () => {\n    const target = storage({\n      getItem: vi.fn(() => {\n        throw new DOMException('blocked');\n      }),\n    });\n\n    expect(loadPreferences(target)).toEqual({ ok: false, value: defaults, reason: 'unavailable' });\n  });\n\n  it('returns false for write failure and never claims a successful save', () => {\n    const target = storage({\n      setItem: vi.fn(() => {\n        throw new DOMException('blocked');\n      }),\n    });\n\n    expect(savePreferences(target, defaults)).toBe(false);\n  });\n\n  it('ignores unknown keys while retaining all known valid values', () => {\n    const value = { ...defaults, bestScore: 99, unknown: 'ignored' };\n    const target = storage({ getItem: vi.fn(() => JSON.stringify(value)) });\n\n    expect(loadPreferences(target)).toEqual({\n      ok: true,\n      value: { ...defaults, bestScore: 99 },\n    });\n  });\n});\n\ndescribe('reduced-motion preference precedence', () => {\n  it('uses explicit local overrides before the OS media query', () => {\n    expect(resolveReducedMotion('on', () => false)).toBe(true);\n    expect(resolveReducedMotion('off', () => true)).toBe(false);\n    expect(resolveReducedMotion('system', () => true)).toBe(true);\n    expect(resolveReducedMotion('system', () => false)).toBe(false);\n  });\n\n  it('falls back to no preference when matchMedia is unavailable or throws', () => {\n    expect(resolveReducedMotion('system', undefined)).toBe(false);\n    expect(\n      resolveReducedMotion('system', () => {\n        throw new Error('unsupported');\n      }),\n    ).toBe(false);\n  });\n});\n"},"tests/unit/scheduler.contract.test.ts":{"tests":[{"id":"109","name":"fixed-step scheduler contract runs one reducer tick per 1/60 second and caps a frame at five ticks"},{"id":"110","name":"fixed-step scheduler contract clamps one frame delta to 250ms and discards excess catch-up after the cap"},{"id":"111","name":"fixed-step scheduler contract stops scheduling while paused or hidden and resumes only from a fresh visible frame"}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { createFixedStepScheduler } from '../../src/platform/scheduler';\n\ndescribe('fixed-step scheduler contract', () => {\n  it('runs one reducer tick per 1/60 second and caps a frame at five ticks', () => {\n    const onTick = vi.fn();\n    const scheduler = createFixedStepScheduler({ onTick });\n\n    scheduler.frame(1 / 60);\n    expect(onTick).toHaveBeenCalledTimes(1);\n    scheduler.frame(0.25);\n    expect(onTick).toHaveBeenCalledTimes(6);\n  });\n\n  it('clamps one frame delta to 250ms and discards excess catch-up after the cap', () => {\n    const onTick = vi.fn();\n    const scheduler = createFixedStepScheduler({ onTick });\n\n    scheduler.frame(5);\n    expect(onTick).toHaveBeenCalledTimes(5);\n    scheduler.frame(0);\n    expect(onTick).toHaveBeenCalledTimes(5);\n  });\n\n  it('stops scheduling while paused or hidden and resumes only from a fresh visible frame', () => {\n    const onTick = vi.fn();\n    const scheduler = createFixedStepScheduler({ onTick });\n\n    scheduler.frame(1 / 60);\n    scheduler.setRunning(false);\n    scheduler.frame(1);\n    expect(onTick).toHaveBeenCalledTimes(1);\n    scheduler.setRunning(true);\n    scheduler.frame(1 / 60);\n    expect(onTick).toHaveBeenCalledTimes(2);\n  });\n});\n"},"tests/unit/lifecycle.contract.test.ts":{"tests":[{"id":"112","name":"optional audio boundary does not create an AudioContext until a user gesture"},{"id":"113","name":"optional audio boundary disables itself and emits one public notice when context creation fails"},{"id":"114","name":"optional audio boundary never changes game state and suppresses scheduling while muted or paused"},{"id":"115","name":"visibility and lifecycle boundary pauses immediately with visibility reason, clears input, and never auto-resumes"},{"id":"116","name":"visibility and lifecycle boundary rejects Resume while hidden and accepts it only after visible user action"},{"id":"117","name":"visibility and lifecycle boundary does not pause for blur alone and suspends audio on pagehide when supported"}],"source":"import { describe, expect, it, vi } from 'vitest';\nimport { createAudioController } from '../../src/platform/audio';\nimport { createVisibilityController } from '../../src/platform/visibility';\n\ndescribe('optional audio boundary', () => {\n  it('does not create an AudioContext until a user gesture', () => {\n    const createContext = vi.fn(() => ({ close: vi.fn() }));\n    const audio = createAudioController({ createContext });\n\n    expect(createContext).not.toHaveBeenCalled();\n    audio.play('pickup');\n    expect(createContext).not.toHaveBeenCalled();\n    audio.activate();\n    expect(createContext).toHaveBeenCalledTimes(1);\n  });\n\n  it('disables itself and emits one public notice when context creation fails', () => {\n    const audio = createAudioController({\n      createContext: () => {\n        throw new Error('AudioContext blocked');\n      },\n    });\n\n    audio.activate();\n    audio.activate();\n    expect(audio.isAvailable()).toBe(false);\n    expect(audio.notices()).toEqual(['audio-unavailable']);\n  });\n\n  it('never changes game state and suppresses scheduling while muted or paused', () => {\n    const context = { close: vi.fn(), resume: vi.fn(), suspend: vi.fn() };\n    const schedule = vi.fn();\n    const audio = createAudioController({ createContext: () => context, schedule });\n\n    audio.activate();\n    audio.setMuted(true);\n    audio.play('win');\n    audio.setPaused(true);\n    audio.play('loss');\n    expect(schedule).not.toHaveBeenCalled();\n  });\n});\n\ndescribe('visi
